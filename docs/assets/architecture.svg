<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="title desc">
  <title id="title">FleetCam — arquitetura</title>
  <desc id="desc">Câmeras simuladas enviam telemetria via gRPC ao ingestion-service, que publica no Kafka. O device-health-service e o safety-event-processor consomem os tópicos e gravam no Postgres; eventos inválidos vão para a DLT. Métricas vão para Prometheus e Grafana.</desc>

  <defs>
    <style>
      .card   { fill: #0d1117; }
      .box    { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .title  { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .sub    { font: 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .tiny   { font: 11px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #8b949e; }
      .head   { font: 700 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .wire   { fill: none; stroke: #30363d; stroke-width: 2; }
      .flow   { fill: none; stroke-width: 2; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      .metric { fill: none; stroke: #a371f7; stroke-width: 1.5; stroke-dasharray: 3 6; opacity: .7; animation: dash 2.4s linear infinite; }
      .grpc   { stroke: #58a6ff; }
      .hb     { stroke: #2dd4bf; }
      .ev     { stroke: #f59e0b; }
      .bad    { stroke: #f85149; }
      .gql    { stroke: #e6edf3; opacity: .55; }
      .lane   { fill: #0d1117; stroke: #30363d; }
      .blink  { animation: blink 1.4s ease-in-out infinite; }
      .pulse  { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes dash  { to { stroke-dashoffset: -28; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    </style>

    <path id="p-sim-ing"     d="M200,260 L260,260"/>
    <path id="p-ing-kafka"   d="M430,260 L490,260"/>
    <path id="p-kafka-hb"    d="M500,215 L630,215"/>
    <path id="p-kafka-ev"    d="M500,305 L630,305"/>
    <path id="p-kafka-health" d="M640,215 C680,215 680,135 720,135"/>
    <path id="p-kafka-safety" d="M640,305 C680,305 680,385 720,385"/>
    <path id="p-health-pg"   d="M890,135 L930,135"/>
    <path id="p-safety-pg"   d="M890,385 L930,385"/>
    <path id="p-safety-dlt"  d="M805,420 L805,470"/>
    <path id="p-health-ui"   d="M890,155 C912,155 908,260 930,260"/>
  </defs>

  <rect class="card" width="1100" height="600" rx="16"/>
  <text class="head" x="30" y="44">FleetCam</text>
  <text class="sub" x="128" y="44">da câmera em campo ao painel</text>

  <!-- ===== Observability ===== -->
  <rect class="box" x="260" y="70" width="370" height="54" rx="10"/>
  <text class="title" x="280" y="93">Prometheus → Grafana</text>
  <text class="sub" x="280" y="112">SLO 99% &lt; 30s · burn-rate alerts · dashboards</text>
  <circle cx="606" cy="97" r="6" fill="#a371f7" class="pulse"/>
  <path class="metric" d="M345,225 L345,124"/>
  <path class="metric" d="M805,100 L805,90 L630,90"/>
  <path class="metric" d="M720,400 L700,400 L700,450 L345,450 L345,295"/>

  <!-- ===== Wires (static base) ===== -->
  <use href="#p-sim-ing" class="wire"/>
  <use href="#p-ing-kafka" class="wire"/>
  <use href="#p-kafka-health" class="wire"/>
  <use href="#p-kafka-safety" class="wire"/>
  <use href="#p-health-pg" class="wire"/>
  <use href="#p-safety-pg" class="wire"/>
  <use href="#p-safety-dlt" class="wire"/>
  <use href="#p-health-ui" class="wire"/>

  <!-- ===== Animated flows ===== -->
  <use href="#p-sim-ing" class="flow grpc"/>
  <use href="#p-ing-kafka" class="flow grpc"/>
  <use href="#p-kafka-health" class="flow hb"/>
  <use href="#p-kafka-safety" class="flow ev"/>
  <use href="#p-health-pg" class="flow hb"/>
  <use href="#p-safety-pg" class="flow ev"/>
  <use href="#p-safety-dlt" class="flow bad"/>
  <use href="#p-health-ui" class="flow gql"/>

  <!-- ===== Device simulator ===== -->
  <rect class="box" x="30" y="190" width="170" height="140" rx="10"/>
  <text class="title" x="48" y="215">device-simulator</text>
  <text class="sub" x="48" y="234">câmeras + falhas</text>
  <g transform="translate(48,250)">
    <rect width="38" height="26" rx="5" fill="#21262d"/><circle cx="19" cy="13" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="33" cy="5" r="3" fill="#2dd4bf"/>
  </g>
  <g transform="translate(96,250)">
    <rect width="38" height="26" rx="5" fill="#21262d"/><circle cx="19" cy="13" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="33" cy="5" r="3" fill="#2dd4bf"/>
  </g>
  <g transform="translate(144,250)">
    <rect width="38" height="26" rx="5" fill="#21262d"/><circle cx="19" cy="13" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="33" cy="5" r="3" fill="#f85149" class="blink"/>
  </g>
  <text class="tiny" x="48" y="300">SD · reboot · clock</text>
  <text class="tiny" x="48" y="316">skew · rede instável</text>

  <!-- ===== Ingestion ===== -->
  <rect class="box" x="260" y="225" width="170" height="70" rx="10"/>
  <text class="title" x="278" y="252">ingestion-service</text>
  <text class="sub" x="278" y="272">gRPC gateway · acks=all</text>
  <text class="tiny" x="207" y="250">gRPC</text>

  <!-- ===== Kafka ===== -->
  <rect class="box" x="490" y="160" width="150" height="200" rx="10"/>
  <text class="title" x="508" y="186">Kafka</text>
  <text class="tiny" x="508" y="202">key = deviceId</text>
  <rect class="lane" x="500" y="208" width="130" height="16" rx="8"/>
  <rect class="lane" x="500" y="298" width="130" height="16" rx="8"/>
  <text class="tiny" x="502" y="242">heartbeats.v1</text>
  <text class="tiny" x="502" y="332">safety-events.v1</text>
  <text class="tiny" x="508" y="350">6 partições</text>

  <!-- ===== Health ===== -->
  <rect class="box" x="720" y="100" width="170" height="70" rx="10"/>
  <text class="title" x="738" y="127">device-health</text>
  <text class="sub" x="738" y="147">SD · reboot · offline</text>
  <circle cx="881" cy="109" r="4" fill="#2dd4bf" class="pulse"/>

  <!-- ===== Safety ===== -->
  <rect class="box" x="720" y="350" width="170" height="70" rx="10"/>
  <text class="title" x="738" y="377">safety-processor</text>
  <text class="sub" x="738" y="397">idempotente · clock fix</text>
  <circle cx="881" cy="359" r="4" fill="#f59e0b" class="pulse"/>

  <!-- ===== DLT ===== -->
  <rect class="box" x="740" y="470" width="130" height="44" rx="10" stroke="#f85149"/>
  <text class="title" x="758" y="497" style="fill:#f85149">DLT</text>
  <text class="tiny" x="796" y="497">inválidos</text>

  <!-- ===== Postgres + panel ===== -->
  <g>
    <path class="box" d="M930,115 a70,10 0 0 1 140,0 v42 a70,10 0 0 1 -140,0 z"/>
    <ellipse cx="1000" cy="115" rx="70" ry="10" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text class="title" x="950" y="143">Postgres</text>
    <text class="tiny" x="950" y="160">fleet_health</text>
  </g>
  <g>
    <path class="box" d="M930,365 a70,10 0 0 1 140,0 v42 a70,10 0 0 1 -140,0 z"/>
    <ellipse cx="1000" cy="365" rx="70" ry="10" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text class="title" x="950" y="393">Postgres</text>
    <text class="tiny" x="950" y="410">fleet_safety</text>
  </g>
  <rect class="box" x="930" y="232" width="140" height="56" rx="10"/>
  <text class="title" x="948" y="256">Painel</text>
  <text class="sub" x="948" y="275">GraphQL · Suporte</text>

  <!-- ===== Packets ===== -->
  <g>
    <circle r="5" fill="#58a6ff"><animateMotion dur="1.1s" repeatCount="indefinite"><mpath href="#p-sim-ing"/></animateMotion></circle>
    <circle r="5" fill="#58a6ff"><animateMotion dur="1.1s" begin="0.55s" repeatCount="indefinite"><mpath href="#p-sim-ing"/></animateMotion></circle>
    <circle r="5" fill="#58a6ff"><animateMotion dur="1.1s" begin="0.3s" repeatCount="indefinite"><mpath href="#p-ing-kafka"/></animateMotion></circle>

    <circle r="4" fill="#2dd4bf"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p-kafka-hb"/></animateMotion></circle>
    <circle r="4" fill="#2dd4bf"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#p-kafka-hb"/></animateMotion></circle>
    <circle r="4" fill="#f59e0b"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#p-kafka-ev"/></animateMotion></circle>

    <circle r="5" fill="#2dd4bf"><animateMotion dur="1.4s" begin="0.2s" repeatCount="indefinite"><mpath href="#p-kafka-health"/></animateMotion></circle>
    <circle r="5" fill="#f59e0b"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#p-kafka-safety"/></animateMotion></circle>
    <circle r="4" fill="#2dd4bf"><animateMotion dur="1s" begin="0.6s" repeatCount="indefinite"><mpath href="#p-health-pg"/></animateMotion></circle>
    <circle r="4" fill="#f59e0b"><animateMotion dur="1s" begin="1.2s" repeatCount="indefinite"><mpath href="#p-safety-pg"/></animateMotion></circle>
    <circle r="4" fill="#e6edf3" opacity=".8"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath href="#p-health-ui"/></animateMotion></circle>
    <!-- an occasional invalid event dropping into the DLT -->
    <circle r="4" fill="#f85149" opacity="0">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6;0.85;1" calcMode="linear"><mpath href="#p-safety-dlt"/></animateMotion>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.59;0.6;0.85;1"/>
    </circle>
  </g>

  <!-- ===== Legend ===== -->
  <g transform="translate(30,560)">
    <circle r="5" cy="-4" fill="#58a6ff"/><text class="sub" x="12">telemetria gRPC</text>
    <circle r="5" cx="140" cy="-4" fill="#2dd4bf"/><text class="sub" x="152">heartbeat</text>
    <circle r="5" cx="240" cy="-4" fill="#f59e0b"/><text class="sub" x="252">evento de IA</text>
    <circle r="5" cx="350" cy="-4" fill="#f85149"/><text class="sub" x="362">inválido → DLT</text>
    <circle r="5" cx="480" cy="-4" fill="#a371f7"/><text class="sub" x="492">métricas</text>
    <text class="tiny" x="1040" text-anchor="end">Kotlin · Spring Boot · Kafka · gRPC · Postgres</text>
  </g>
</svg>
