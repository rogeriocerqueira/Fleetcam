# Local environment.
#   docker compose up -d                      -> infra only (run services with ./gradlew bootRun)
#   docker compose --profile apps up -d       -> infra + services + simulator (run `make build` first)
name: fleetcam

services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on: [kafka]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: fleetcam
      POSTGRES_PASSWORD: fleetcam
      POSTGRES_DB: fleetcam
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetcam"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9091:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # ---------- application services (profile: apps) ----------

  ingestion-service:
    profiles: [apps]
    build:
      context: ./services/ingestion-service
      dockerfile: ../../infra/docker/service.Dockerfile
    ports: ["8081:8081", "9090:9090"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  device-health-service:
    profiles: [apps]
    build:
      context: ./services/device-health-service
      dockerfile: ../../infra/docker/service.Dockerfile
    ports: ["8082:8082"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DB_URL: jdbc:postgresql://postgres:5432/fleet_health
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  safety-event-processor:
    profiles: [apps]
    build:
      context: ./services/safety-event-processor
      dockerfile: ../../infra/docker/service.Dockerfile
    ports: ["8083:8083"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DB_URL: jdbc:postgresql://postgres:5432/fleet_safety
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  device-simulator:
    profiles: [apps]
    build:
      context: ./device-simulator
      dockerfile: ../infra/docker/simulator.Dockerfile
    environment:
      GATEWAY_TARGET: ingestion-service:9090
      DEVICES: "50"
    depends_on: [ingestion-service]
