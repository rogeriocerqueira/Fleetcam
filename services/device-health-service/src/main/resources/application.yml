server:
  port: 8082

spring:
  application:
    name: device-health-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet_health}
    username: ${DB_USER:fleetcam}
    password: ${DB_PASSWORD:fleetcam}
  graphql:
    graphiql:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: dev.fleetcam.contracts.events.HeartbeatReceived
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.fleetcam.contracts.events

fleetcam:
  health:
    sd-write-errors-warn: 10
    sd-low-space-ratio: 0.05
    reboot-loop-count: 3
    reboot-loop-window: 30m
    clock-skew-tolerance: 5m
    offline-after: 5m
    offline-sweep-interval-ms: 30000
    gauge-refresh-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      service: ${spring.application.name}
