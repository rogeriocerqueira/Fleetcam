server:
  port: 8083

spring:
  application:
    name: safety-event-processor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet_safety}
    username: ${DB_USER:fleetcam}
    password: ${DB_PASSWORD:fleetcam}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: dev.fleetcam.contracts.events.SafetyEventReceived
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.fleetcam.contracts.events
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

fleetcam:
  safety:
    clock-correction-tolerance: 5m
    dlt-partitions: 6

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      service: ${spring.application.name}
