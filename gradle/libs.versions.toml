[versions]
kotlin = "1.9.25"
spring-boot = "3.5.0"
spring-dependency-management = "1.1.7"
protobuf-gradle = "0.9.4"
protoc = "3.25.5"
grpc-java = "1.68.1"
grpc-kotlin = "1.4.1"
coroutines = "1.8.1"
junit = "6.1.3"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protoc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc-java" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc-java" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc-java" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
tomcat-annotations = { module = "org.apache.tomcat:annotations-api", version = "6.0.53" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-gradle" }
